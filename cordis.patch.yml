# Installs the loopback proxy that adds the TokenHub `fast` (priority) service tier.
#
# The row carries no config on purpose: `enabled` and `models` live in the plugin's
# Config schema, so DSH renders them as a form and writes changes through the
# settings service. Edit them in DSH (Plugins -> dsh-tokenhub-fast -> Configure),
# not in this file.
- insert:
    - id: tokenhub-fast-proxy
      name: dsh-tokenhub-fast
