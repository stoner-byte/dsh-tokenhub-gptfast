# Installs the loopback proxy that requests the `fast` (priority) service tier
# for whitelisted models via a configurable relay API baseURL.
#
# The row carries no config on purpose: settings live in the plugin's Config
# schema, so DSH renders them as a form and writes changes through the settings
# service. Edit them in DSH (Plugins -> dsh-tokenhub-gptfast -> Configure),
# not in this file.
- insert:
    - id: dsh-tokenhub-gptfast
      name: dsh-tokenhub-gptfast
